ng:8px;cursor:pointer}.answer{color:#58e0c0;margin-top:12px}.toolbar{display:flex;justify-content:space-between;margin:15px 0}button:disabled{opacity:.4;cursor:default}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{height:auto;position:static}nav{max-height:180px;overflow:auto}main{padding:14px}}</style><div class="shell"><aside><h1>RTR4 · Transform</h1><p>约 60–75 分钟<br>3 个实验 · 10 道题</p><nav id="nav"></nav></aside><main><div class="toolbar"><button id="prev">← 上一节</button><span id="count"></span><button id="next">下一节 →</button></div><h1 id="title"></h1><div id="content"></div><div class="notes" id="notes"></div><p style="color:#91a6bd">来源：用户提供的《Real-Time Rendering 4th》第四章中文笔记。由 Codex 重组编写。离线版不含实时 AI 问答与语音。</p></main></div><script>const M={"formatVersion":1,"exportedAt":"2026-11-03T11:56:08.900Z","appVersion":"1.3.1","stage":{"name":"RTR4 第四章：从变换到投影","description":"约60–75分钟｜中文讲解｜3个交互实验｜10道含解析测验。由Codex依据本地第四章资料编写；无需模型Key即可阅读和操作实验，实时AI问答与语音需另行配置。","language":"简体中文","style":"技术课堂","createdAt":1793706968901,"updatedAt":1793706968901},"agents":[],"scenes":[{"type":"slide","title":"从一个顶点，到屏幕上的像素","order":0,"content":{"type":"slide","canvas":{"id":"rtr4-1","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-1-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">课程导入 · 约 60–75 分钟\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-1-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">从一个顶点，到屏幕上的像素\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-1-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">目标一：用齐次坐标区分点、方向与法线，正确排列矩阵乘法。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">目标二：解释四元数、蒙皮、形状混合分别解决什么问题。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">目标三：推导透视除法，理解深度精度为何集中在近处。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">先修：向量点积、叉积与矩阵乘法。每个实验先预测，再拖动滑块验证。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-1-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">pclip = P · V · M · p\npNDC = pclip.xyz / pclip.w\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-1-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">本课采用列向量、矩阵左乘。三维示例使用右手系；相机看向 −Z。数值角度展示用度，三角函数内部用弧度。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-1-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　课程导入 · 约 60–75 分钟　｜　01\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"这堂课不是公式清单，而是一条从物体到屏幕的路径。你将反复问：现在处理的是什么几何量？它在哪个坐标系？下一步把它变到哪里？全课按列向量左乘约定讲解。课堂已有文字讲解、三个独立实验和十道客观题；实时AI问答与合成语音需要另行配置服务。"}},"actions":[{"id":"rtr4-1-speech","type":"speech","text":"这堂课不是公式清单，而是一条从物体到屏幕的路径。你将反复问：现在处理的是什么几何量？它在哪个坐标系？下一步把它变到哪里？全课按列向量左乘约定讲解。课堂已有文字讲解、三个独立实验和十道客观题；实时AI问答与合成语音需要另行配置服务。"}]},{"type":"slide","title":"先建立一张章节地图","order":1,"content":{"type":"slide","canvas":{"id":"rtr4-2","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-2-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">原资料 §4.1–4.7\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-2-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">先建立一张章节地图\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-2-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">4.1 基本变换：平移、旋转、缩放、剪切，组合、逆矩阵与法线。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">4.2–4.3 表示朝向：欧拉角、分解、任意轴旋转、四元数与插值。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">4.4–4.6 让网格运动：顶点混合、变形目标、几何缓存。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">4.7 让三维变成画面：正交投影、透视除法、深度缓冲。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-2-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">几何量 → 坐标变换\n朝向 → 动画\n相机 → 投影 → 深度\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-2-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">贯穿问题：同一组数值，换一种对象类型、坐标约定或运算顺序，结果为何不同？\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-2-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　原资料 §4.1–4.7　｜　02\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"建议节奏：基本变换二十分钟，旋转表示十五分钟，网格动画十分钟，投影十五分钟，最后测验和排错五到十五分钟。熟悉矩阵的同学可以快速浏览基础页，但不要跳过法线和透视除法两个检查点。"}},"actions":[{"id":"rtr4-2-speech","type":"speech","text":"建议节奏：基本变换二十分钟，旋转表示十五分钟，网格动画十分钟，投影十五分钟，最后测验和排错五到十五分钟。熟悉矩阵的同学可以快速浏览基础页，但不要跳过法线和透视除法两个检查点。"}]},{"type":"slide","title":"齐次坐标：用 w 区分点与方向","order":2,"content":{"type":"slide","canvas":{"id":"rtr4-3","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-3-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.1 · 基本概念\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-3-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">齐次坐标：用 w 区分点与方向\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-3-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">线性变换 f(x)=Ax 保持加法与数乘，并且 f(0)=0。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">平移 f(x)=Ax+t 是仿射变换；t≠0 时通常不是线性变换。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">点写作 (x,y,z,1)ᵀ；方向写作 (x,y,z,0)ᵀ，平移只影响前者。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">非退化仿射变换保持直线和平行关系，不一定保持长度和角度。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-3-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">M = [ A  t ]\n    [ 0  1 ]\nMp = Ap + t\nMv = Av\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-3-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">平移 t=(5,2,0)：点 (1,1,0) → (6,3,0)；方向 (1,1,0) 保持不变。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-3-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.1 · 基本概念　｜　03\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"方向没有固定位置，因此不能被平移。齐次坐标并不是让空间突然增加一个可见维度，而是把线性部分与平移统一放进矩阵。请注意法线虽常用三个数表示，却还带着与切平面垂直的约束，稍后不能直接把它当普通方向处理。"}},"actions":[{"id":"rtr4-3-speech","type":"speech","text":"方向没有固定位置，因此不能被平移。齐次坐标并不是让空间突然增加一个可见维度，而是把线性部分与平移统一放进矩阵。请注意法线虽常用三个数表示，却还带着与切平面垂直的约束，稍后不能直接把它当普通方向处理。"}]},{"type":"slide","title":"四种基础操作，四种几何效果","order":3,"content":{"type":"slide","canvas":{"id":"rtr4-4","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-4-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.1.1–4.1.4\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-4-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">四种基础操作，四种几何效果\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-4-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">平移：改变位置。旋转：改变朝向，保持长度、夹角与手性。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">缩放：分别改变三个轴的尺度；缩放系数为零时矩阵不可逆。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">负缩放可能翻转手性；奇数个负轴使三维线性部分行列式为负。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">剪切：一个分量依赖另一个分量，例如 x′=x+sy。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-4-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">Rz(θ) 的 XY 部分\n[ cosθ  −sinθ ]\n[ sinθ   cosθ ]\nS = diag(sx,sy,sz,1)\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-4-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">绕 +Z 旋转 +90°：在 XY 平面从 +X 转向 +Y，(1,0,0) → (0,1,0)。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-4-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.1.1–4.1.4　｜　04\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"在本课右手系与主动旋转约定下，从正Z朝原点看，正角度从X轴转向Y轴。负缩放也会影响三角形绕序和背面剔除。两轴都为负只有在绝对缩放量为一的特殊情况下才是纯粹的一百八十度旋转，不要把任意负缩放都称为纯旋转。"}},"actions":[{"id":"rtr4-4-speech","type":"speech","text":"在本课右手系与主动旋转约定下，从正Z朝原点看，正角度从X轴转向Y轴。负缩放也会影响三角形绕序和背面剔除。两轴都为负只有在绝对缩放量为一的特殊情况下才是纯粹的一百八十度旋转，不要把任意负缩放都称为纯旋转。"}]},{"type":"slide","title":"TRS：最右边的矩阵先作用","order":4,"content":{"type":"slide","canvas":{"id":"rtr4-5","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-5-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.1.5 · 运算顺序\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-5-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">TRS：最右边的矩阵先作用\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-5-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">p′=TRSp 表示：先缩放，再旋转，最后平移。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">矩阵乘法有结合律：(TR)S=T(RS)，可以预先合成矩阵。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">矩阵乘法一般不交换；但单位矩阵等特殊情况可以交换。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">先在纸上算一个点，再判断整个物体的变换是否符合预期。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-5-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">p=(1,0)\nS=diag(2,1), R=90°\nT=(3,0)\nTRSp=(3,2)\nRTSp=(0,5)\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-5-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">重要区分：行/列向量是代数约定；行主序/列主序是内存布局。二者相关但并不等同。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-5-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.1.5 · 运算顺序　｜　05\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"这页纠正原笔记中容易误读的两个地方。首先，一般不满足交换律不代表任意两矩阵都不相等。其次，内存按行存还是按列存，不能单独决定向量写在左边还是右边。要看库的乘法约定，再看上传到着色器时有没有转置。数值例子中，先缩放得到二零，旋转得到零二，再平移得到三二。"}},"actions":[{"id":"rtr4-5-speech","type":"speech","text":"这页纠正原笔记中容易误读的两个地方。首先，一般不满足交换律不代表任意两矩阵都不相等。其次，内存按行存还是按列存，不能单独决定向量写在左边还是右边。要看库的乘法约定，再看上传到着色器时有没有转置。数值例子中，先缩放得到二零，旋转得到零二，再平移得到三二。"}]},{"type":"interactive","title":"实验一：交换变换顺序，会发生什么？","order":5,"content":{"type":"interactive","widgetType":"simulation","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>实验一：交换变换顺序，会发生什么？\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#eaf2fb;font:16px/1.6 'Microsoft YaHei',sans-serif;padding:24px}h1{font-size:27px;margin:0 0 5px;color:#58e0c0}p{margin:8px 0}.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;margin-top:20px}.panel{background:#192b40;border:1px solid #30475d;border-radius:16px;padding:20px}label{display:block;margin:12px 0 5px}input[type=range]{width:100%;accent-color:#58e0c0}button,select{font:inherit;border:1px solid #52768a;background:#213b52;color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}button:hover{background:#326079}canvas{background:#0b1624;border:1px solid #30475d;border-radius:14px;width:100%;height:auto}output,.value{color:#58e0c0;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#102033;padding:12px;border-radius:8px;font-size:15px}.tip{color:#ffc979}details{margin-top:14px}summary{cursor:pointer;color:#ffc979}.legend{display:flex;gap:20px;flex-wrap:wrap}.legend span{font-weight:bold}@media(max-width:760px){.layout{grid-template-columns:1fr}body{padding:12px}}\u003c/style>\u003cbody>\n\u003ch1>实验一 · 变换顺序实验室\u003c/h1>\u003cp>坐标系为 X 向右、Y 向上；列向量左乘。虚线是原图，青色是结果。\u003c/p>\u003cdiv class=\"layout\">\u003csection class=\"panel\">\n\u003clabel for=\"order\">矩阵顺序（右侧先执行）\u003c/label>\u003cselect id=\"order\">\u003coption>TRS\u003c/option>\u003coption>RTS\u003c/option>\u003coption>TSR\u003c/option>\u003coption>STR\u003c/option>\u003c/select>\n\u003clabel for=\"angle\">绕原点旋转 θ：\u003coutput id=\"av\">\u003c/output>°\u003c/label>\u003cinput id=\"angle\" type=\"range\" min=\"-180\" max=\"180\" value=\"90\">\n\u003clabel for=\"sx\">X 缩放：\u003coutput id=\"sv\">\u003c/output>\u003c/label>\u003cinput id=\"sx\" type=\"range\" min=\"0.25\" max=\"3\" step=\"0.05\" value=\"2\">\n\u003clabel for=\"tx\">X 平移：\u003coutput id=\"tv\">\u003c/output>\u003c/label>\u003cinput id=\"tx\" type=\"range\" min=\"-3\" max=\"3\" step=\"0.1\" value=\"3\">\n\u003cbutton id=\"reset\">重置数值\u003c/button>\u003cpre id=\"result\">\u003c/pre>\u003c/section>\u003csection>\u003ccanvas id=\"c\" width=\"800\" height=\"540\">\u003c/canvas>\u003cp class=\"tip\">任务：保持默认数值，先预测红点 (1,0) 的结果，再将 TRS 改为 RTS。\u003c/p>\u003cdetails>\u003csummary>查看解析\u003c/summary>\u003cp>TRS：先 S→(2,0)，再 R→(0,2)，最后 T→(3,2)。RTS：先 S→(2,0)，再 T→(5,0)，最后 R→(0,5)。旋转会连同先前的位移一起旋转。\u003c/p>\u003c/details>\u003c/section>\u003c/div>\u003cscript>const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');const P=p=>[400+p[0]*42,270-p[1]*42];function draw(){const a=+$('angle').value*Math.PI/180,s=+$('sx').value,t=+$('tx').value,o=$('order').value;const f=p=>{let [x,y]=p;for(const k of [...o].reverse()){if(k==='S')x*=s;if(k==='T')x+=t;if(k==='R')[x,y]=[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)]}return[x,y]};g.clearRect(0,0,800,540);g.lineWidth=1;for(let i=-9;i\u003c=9;i++){g.strokeStyle=i===0?'#7590aa':'#203247';g.beginPath();g.moveTo(...P([i,-6]));g.lineTo(...P([i,6]));g.stroke()}for(let i=-6;i\u003c=6;i++){g.strokeStyle=i===0?'#7590aa':'#203247';g.beginPath();g.moveTo(...P([-9,i]));g.lineTo(...P([9,i]));g.stroke()}const poly=[[0,0],[1,0],[1,1],[0,1]];function shape(ps,color,dash){g.strokeStyle=color;g.lineWidth=3;g.setLineDash(dash);g.beginPath();ps.forEach((p,i)=>i?g.lineTo(...P(p)):g.moveTo(...P(p)));g.closePath();g.stroke();g.setLineDash([])}shape(poly,'#71869e',[6,6]);shape(poly.map(f),'#58e0c0',[]);const r=f([1,0]);g.fillStyle='#ff817c';g.beginPath();g.arc(...P(r),6,0,Math.PI*2);g.fill();g.fillStyle='#f4f7fb';g.font='18px sans-serif';g.fillText('X',775,255);g.fillText('Y',413,22);$('av').textContent=$('angle').value;$('sv').textContent=s.toFixed(2);$('tv').textContent=t.toFixed(1);$('result').textContent=o+' · (1,0) = ('+r.map(v=>v.toFixed(2)).join(', ')+')'}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',draw));$('reset').onclick=()=>{$('order').value='TRS';$('angle').value=90;$('sx').value=2;$('tx').value=3;draw()};draw();\u003c/script>\u003c/body>\u003c/html>"},"actions":[{"id":"lab-note-5","type":"speech","text":"先预测再操作。这个实验使用二维截面，但矩阵先后顺序的规则与三维完全一样。默认红点在TRS下落到三二，换成RTS后落到零五。变化来自平移是否发生在旋转之前。"}]},{"type":"slide","title":"绕指定点旋转：先搬到原点","order":6,"content":{"type":"slide","canvas":{"id":"rtr4-7","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-7-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.1.2 · 支点与坐标层级\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-7-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">绕指定点旋转：先搬到原点\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-7-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">要绕支点 c 旋转，先用 T(−c) 把支点搬到原点。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">完成旋转 R 后，再用 T(c) 把支点搬回去。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">父子层级可写为 Mworld=Mparent·Mlocal，右侧先作用。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">检验支点不动：将 p=c 代入，结果必须仍是 c。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-7-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">M = T(c) R T(−c)\nc=(2,1), p=(3,1)\nR=90°\np′=(2,2)\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-7-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">游戏例子：门绕铰链转，手里的武器随手部骨骼移动。每个矩阵都必须明确“从哪个空间到哪个空间”。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-7-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.1.2 · 支点与坐标层级　｜　07\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"绕任意点旋转不是先旋转再补一个看起来差不多的平移，而是一个完整的坐标变换。对于父子层级，子节点局部变换先把顶点变到父空间，父矩阵再把它变到世界空间。支点不动是非常便宜而有效的单点测试。"}},"actions":[{"id":"rtr4-7-speech","type":"speech","text":"绕任意点旋转不是先旋转再补一个看起来差不多的平移，而是一个完整的坐标变换。对于父子层级，子节点局部变换先把顶点变到父空间，父矩阵再把它变到世界空间。支点不动是非常便宜而有效的单点测试。"}]},{"type":"slide","title":"法线的目标：始终垂直于切线","order":7,"content":{"type":"slide","canvas":{"id":"rtr4-8","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-8-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.1.7 · 重点推导\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-8-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">法线的目标：始终垂直于切线\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-8-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">切向量按 t′=At 变换；法线要求 n′·t′=0。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">若 A 可逆，选择 n′=A⁻ᵀn，则 (A⁻ᵀn)ᵀAt=nᵀt=0。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">只用模型或模型视图矩阵的线性 3×3 部分，随后归一化。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">非均匀缩放下，直接用 An 再归一化，仍可能方向错误。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-8-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">t=(1,1), n=(−1,1)\nA=diag(2,1)\nAt=(2,1)\nAn=(−2,1), dot=−3\nA⁻ᵀn=(−0.5,1), dot=0\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-8-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">例外：纯旋转可直接用 R。含零缩放时 A⁻¹ 不存在；曲面退化后，法线可能无法定义。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-8-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.1.7 · 重点推导　｜　08\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"法线不是沿着表面走的方向，它编码的是一个垂直约束。推导只需要将变换后的法线与切线点积写出来。注意归一化只改变长度，不能把一个不垂直的向量修正为垂直。伴随矩阵的转置可表达余因子变换；对退化情况仍须检查是否得到零向量，涉及镜像时还需一致处理法线朝向和绕序。"}},"actions":[{"id":"rtr4-8-speech","type":"speech","text":"法线不是沿着表面走的方向，它编码的是一个垂直约束。推导只需要将变换后的法线与切线点积写出来。注意归一化只改变长度，不能把一个不垂直的向量修正为垂直。伴随矩阵的转置可表达余因子变换；对退化情况仍须检查是否得到零向量，涉及镜像时还需一致处理法线朝向和绕序。"}]},{"type":"interactive","title":"实验二：法线不能只做普通变换","order":8,"content":{"type":"interactive","widgetType":"simulation","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>实验二：法线不能只做普通变换\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#eaf2fb;font:16px/1.6 'Microsoft YaHei',sans-serif;padding:24px}h1{font-size:27px;margin:0 0 5px;color:#58e0c0}p{margin:8px 0}.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;margin-top:20px}.panel{background:#192b40;border:1px solid #30475d;border-radius:16px;padding:20px}label{display:block;margin:12px 0 5px}input[type=range]{width:100%;accent-color:#58e0c0}button,select{font:inherit;border:1px solid #52768a;background:#213b52;color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}button:hover{background:#326079}canvas{background:#0b1624;border:1px solid #30475d;border-radius:14px;width:100%;height:auto}output,.value{color:#58e0c0;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#102033;padding:12px;border-radius:8px;font-size:15px}.tip{color:#ffc979}details{margin-top:14px}summary{cursor:pointer;color:#ffc979}.legend{display:flex;gap:20px;flex-wrap:wrap}.legend span{font-weight:bold}@media(max-width:760px){.layout{grid-template-columns:1fr}body{padding:12px}}\u003c/style>\u003cbody>\n\u003ch1>实验二 · 法线正交性检查\u003c/h1>\u003cp>原切线 t=(1,1)，原法线 n=(−1,1)。改变非均匀缩放，观察两种法线。\u003c/p>\u003cdiv class=\"layout\">\u003csection class=\"panel\">\u003clabel for=\"sx\">X 缩放：\u003coutput id=\"xv\">\u003c/output>\u003c/label>\u003cinput id=\"sx\" type=\"range\" min=\"0.25\" max=\"3\" step=\"0.05\" value=\"2\">\u003clabel for=\"sy\">Y 缩放：\u003coutput id=\"yv\">\u003c/output>\u003c/label>\u003cinput id=\"sy\" type=\"range\" min=\"0.25\" max=\"3\" step=\"0.05\" value=\"1\">\u003cbutton id=\"uniform\">设为均匀缩放\u003c/button>\u003cpre id=\"result\">\u003c/pre>\u003cp>点积使用单位化后的向量。正确法线与切线的点积应接近 0。\u003c/p>\u003c/section>\u003csection>\u003ccanvas id=\"c\" width=\"800\" height=\"500\">\u003c/canvas>\u003cdiv class=\"legend\">\u003cspan style=\"color:#70afff\">蓝：切线 At\u003c/span>\u003cspan style=\"color:#ff817c\">红：错误法线 An\u003c/span>\u003cspan style=\"color:#58e0c0\">青：正确法线 A⁻ᵀn\u003c/span>\u003c/div>\u003cdetails>\u003csummary>为什么“归一化”救不了错误方向？\u003c/summary>\u003cp>归一化只把长度改成 1，不改变朝向。非均匀缩放使原来的直角被压扁；逆转置才恢复垂直约束。\u003c/p>\u003c/details>\u003c/section>\u003c/div>\u003cscript>const $=id=>document.getElementById(id),g=$('c').getContext('2d');const norm=v=>{let l=Math.hypot(...v);return v.map(x=>x/l)},dot=(a,b)=>a[0]*b[0]+a[1]*b[1];function arrow(v,color,label){const x=400+v[0]*170,y=250-v[1]*170,a=Math.atan2(y-250,x-400);g.strokeStyle=color;g.fillStyle=color;g.lineWidth=4;g.beginPath();g.moveTo(400,250);g.lineTo(x,y);g.stroke();g.beginPath();g.moveTo(x,y);g.lineTo(x-15*Math.cos(a-.4),y-15*Math.sin(a-.4));g.lineTo(x-15*Math.cos(a+.4),y-15*Math.sin(a+.4));g.fill();g.font='18px sans-serif';g.fillText(label,x+12,y+8)}function draw(){let x=+$('sx').value,y=+$('sy').value,t=norm([x,y]),bad=norm([-x,y]),good=norm([-1/x,1/y]);g.clearRect(0,0,800,500);g.strokeStyle='#253c50';g.lineWidth=1;for(let k=50;k\u003c800;k+=50){g.beginPath();g.moveTo(k,0);g.lineTo(k,500);g.stroke()}for(let k=0;k\u003c500;k+=50){g.beginPath();g.moveTo(0,k);g.lineTo(800,k);g.stroke()}arrow(t,'#70afff','切线');arrow(bad,'#ff817c','An');arrow(good,'#58e0c0','A⁻ᵀn');$('xv').textContent=x.toFixed(2);$('yv').textContent=y.toFixed(2);$('result').textContent='错误法线 · 切线 = '+dot(t,bad).toFixed(4)+'\\n正确法线 · 切线 = '+dot(t,good).toFixed(4)}document.querySelectorAll('input').forEach(e=>e.oninput=draw);$('uniform').onclick=()=>{$('sx').value=1.5;$('sy').value=1.5;draw()};draw();\u003c/script>\u003c/body>\u003c/html>"},"actions":[{"id":"lab-note-8","type":"speech","text":"默认的二比一缩放让错误法线明显偏离垂直。观察数值，错误点积为负零点六，正确点积为零。点击均匀缩放后，两条法线重合；这解释了为什么某些错误实现只在拉伸模型时暴露问题。"}]},{"type":"slide","title":"相机移动，为什么世界反向移动？","order":9,"content":{"type":"slide","canvas":{"id":"rtr4-10","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-10-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.1.6、4.1.8 · 逆矩阵\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-10-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">相机移动，为什么世界反向移动？\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-10-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">相机的世界变换 C 将相机局部坐标变到世界坐标。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">视图矩阵 V=C⁻¹，把世界坐标重新表达在相机坐标系中。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">刚体矩阵的旋转 R 满足 R⁻¹=Rᵀ，可避免通用求逆。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">注意：带平移的完整 4×4 刚体矩阵通常不能直接转置求逆。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-10-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">C = [ R   t ]\n    [ 0   1 ]\nV = [ Rᵀ  −Rᵀt ]\n    [ 0       1 ]\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-10-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">相机在 (0,0,5)，朝 −Z 且无旋转：世界原点在视图空间的位置为 (0,0,−5)。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-10-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.1.6、4.1.8 · 逆矩阵　｜　10\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"相机向右走，看起来物体就向左走。这不是特殊渲染技巧，而是把同一个点换到不同参考系。逆矩阵会反转执行顺序：TR的逆为R的逆乘T的逆。纯旋转的转置求逆不能不加条件地推广到含平移、缩放或剪切的完整矩阵。"}},"actions":[{"id":"rtr4-10-speech","type":"speech","text":"相机向右走，看起来物体就向左走。这不是特殊渲染技巧，而是把同一个点换到不同参考系。逆矩阵会反转执行顺序：TR的逆为R的逆乘T的逆。纯旋转的转置求逆不能不加条件地推广到含平移、缩放或剪切的完整矩阵。"}]},{"type":"slide","title":"欧拉角：直观，但必须说清旋转约定","order":10,"content":{"type":"slide","canvas":{"id":"rtr4-11","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-11-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.2.1–4.2.2\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-11-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">欧拉角：直观，但必须说清旋转约定\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-11-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">三个角分别描述绕轴的旋转；轴顺序、内旋/外旋约定缺一不可。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">本章示例 E=Rz(r)Rx(p)Ry(h)，其他引擎可能采用不同顺序。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">万向节锁：某些姿态下两个自由度耦合，参数不再独立。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">从矩阵反求角度通常有多组解；奇异姿态需要专门处理。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-11-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">E(h,p,r)\n= Rz(r) Rx(p) Ry(h)\n\n不要只传三个数，\n还要传约定。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-11-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">旋转本身没有“坏掉”；失去唯一性的是欧拉角参数化。避免把三个角逐分量插值当成通用旋转插值。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-11-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.2.1–4.2.2　｜　11\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"欧拉角非常适合操作面板，但不总适合插值或反解。将同样三个角交给不同旋转顺序，结果通常不同。万向节锁是参数表示的奇异性，并不是三维空间真的少了一个方向。工程上保存与插值常使用四元数，再按需要显示欧拉角。"}},"actions":[{"id":"rtr4-11-speech","type":"speech","text":"欧拉角非常适合操作面板，但不总适合插值或反解。将同样三个角交给不同旋转顺序，结果通常不同。万向节锁是参数表示的奇异性，并不是三维空间真的少了一个方向。工程上保存与插值常使用四元数，再按需要显示欧拉角。"}]},{"type":"slide","title":"矩阵分解与任意轴旋转","order":11,"content":{"type":"slide","canvas":{"id":"rtr4-12","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-12-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.2.3–4.2.4\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-12-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">矩阵分解与任意轴旋转\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-12-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">对无剪切的 A=RS，各列长度给出缩放绝对值；归一化列可恢复旋转候选。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">负缩放的符号分配可能不唯一；含剪切时不能机械套用简单 TRS 分解。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">任意单位轴 u 的旋转可用 Rodrigues 公式，或先换基、旋转、换回。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">检验：轴上的向量不动；旋转前后长度不变；RᵀR=I，det(R)=1。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-12-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">Rv = v cosθ\n   + (u × v) sinθ\n   + u(u·v)(1−cosθ)\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-12-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">u=(0,0,1)，θ=90°，v=(1,0,0)：第一项为零，叉乘项为 (0,1,0)，得到熟悉的绕 Z 旋转。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-12-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.2.3–4.2.4　｜　12\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"简单分解有适用前提。若模型带剪切，三个列向量并不正交，直接取列长度再归一化不能得到正确的纯旋转。Rodrigues公式把向量拆成沿轴分量和垂直分量：沿轴部分不变，垂直平面中的部分做二维旋转。"}},"actions":[{"id":"rtr4-12-speech","type":"speech","text":"简单分解有适用前提。若模型带剪切，三个列向量并不正交，直接取列长度再归一化不能得到正确的纯旋转。Rodrigues公式把向量拆成沿轴分量和垂直分量：沿轴部分不变，垂直平面中的部分做二维旋转。"}]},{"type":"slide","title":"四元数：把轴角压进四个数","order":12,"content":{"type":"slide","canvas":{"id":"rtr4-13","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-13-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.3.1–4.3.2\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-13-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">四元数：把轴角压进四个数\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-13-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">采用 (x,y,z,w) 顺序：q=(u·sin(θ/2), cos(θ/2))，u 必须为单位轴。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">单位四元数表示旋转；q 与 −q 表示相同的空间朝向。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">用纯四元数 p=(vx,vy,vz,0)，旋转结果由 qpq⁻¹ 的向量部给出。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">单位四元数的逆是共轭 (−x,−y,−z,w)；乘法顺序仍然重要。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-13-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">绕 Z 轴 +90°\nq=(0,0,√2/2,√2/2)\n\n|q|=1\nq⁻¹=q*（单位 q）\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-13-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">它不是“四个欧拉角”。四元数适合组合和插值，但仍要明确分量顺序、乘法约定及坐标系。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-13-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.3.1–4.3.2　｜　13\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"半角使四元数的单位四维球面与三维旋转联系起来。向量部分的方向给旋转轴，长度与角度有关。重复累乘可能因浮点误差偏离单位长度，必要时重新归一化。单位条件不能省略，否则共轭不一定等于逆。"}},"actions":[{"id":"rtr4-13-speech","type":"speech","text":"半角使四元数的单位四维球面与三维旋转联系起来。向量部分的方向给旋转轴，长度与角度有关。重复累乘可能因浮点误差偏离单位长度，必要时重新归一化。单位条件不能省略，否则共轭不一定等于逆。"}]},{"type":"slide","title":"SLERP：沿旋转空间的短路径前进","order":13,"content":{"type":"slide","canvas":{"id":"rtr4-14","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-14-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.3.2 · 球面线性插值\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-14-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">SLERP：沿旋转空间的短路径前进\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-14-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">先检查 d=q₀·q₁；若 d\u003c0，将 q₁ 取负，使插值选短路径。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">令 Ω=acos(clamp(d,−1,1))，用正弦权重做球面插值。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">当 Ω 很小时，分母接近零，可改用归一化线性插值 NLERP。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">SLERP 在 t 匀速变化时沿选定弧段保持恒定角速度；NLERP 通常不是。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-14-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">q(t)=sin((1−t)Ω)/sinΩ · q₀\n    +sin(tΩ)/sinΩ · q₁\n\n同轴 0° → 90°\nt=0.5 得到 45°\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-14-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">边界案例：q₁=−q₀。两个朝向相同，应先修正符号；直接线性混合可能得到零四元数。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-14-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.3.2 · 球面线性插值　｜　14\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"这里的Ω是四元数球面上两点之间的角，它与物体的旋转角有半角关系。把负点积的终点反号不会改变终点朝向，却能避免绕远路。四元数不会让所有姿态插值自动合理；关节限制、路径设计和多关键帧平滑仍需单独处理。"}},"actions":[{"id":"rtr4-14-speech","type":"speech","text":"这里的Ω是四元数球面上两点之间的角，它与物体的旋转角有半角关系。把负点积的终点反号不会改变终点朝向，却能避免绕远路。四元数不会让所有姿态插值自动合理；关节限制、路径设计和多关键帧平滑仍需单独处理。"}]},{"type":"quiz","title":"阶段测验：变换与旋转（4 题）","order":14,"content":{"type":"quiz","questions":[{"id":"q14-0","type":"single","question":"对列向量 p，表达式 TRSp 的执行顺序是？","options":[{"label":"先 T，再 R，再 S","value":"A"},{"label":"先 S，再 R，再 T","value":"B"},{"label":"先 R，再 T，再 S","value":"C"},{"label":"顺序无关","value":"D"}],"answer":["B"],"analysis":"右边的矩阵先作用：TRSp=T(R(Sp))。","hasAnswer":true,"points":1},{"id":"q14-1","type":"single","question":"对非均匀缩放后的曲面，以下哪种法线处理一般正确？","options":[{"label":"直接使用 An","value":"A"},{"label":"先归一化 n，再用 A","value":"B"},{"label":"使用 A⁻ᵀn 后归一化","value":"C"},{"label":"将法线 w 设为 1","value":"D"}],"answer":["C"],"analysis":"逆转置保持法线与变换后切线的正交性；归一化只调整长度。要求 A 可逆。","hasAnswer":true,"points":1},{"id":"q14-2","type":"multiple","question":"哪些表述成立？（多选）","options":[{"label":"单位四元数 q 与 −q 表示同一旋转","value":"A"},{"label":"行主序存储必然意味着行向量乘法","value":"B"},{"label":"纯旋转矩阵满足 R⁻¹=Rᵀ","value":"C"},{"label":"任意两个矩阵都不交换","value":"D"}],"answer":["A","C"],"analysis":"代数约定与内存布局需要分别确认；矩阵一般不交换，但存在可交换的特殊情况。","hasAnswer":true,"points":1},{"id":"q14-3","type":"single","question":"SLERP 前发现 q₀·q₁\u003c0，通常应如何处理？","options":[{"label":"把 q₁ 取负后重新计算","value":"A"},{"label":"把两个四元数设为零","value":"B"},{"label":"跳过归一化并直接相加","value":"C"},{"label":"交换 x 与 w","value":"D"}],"answer":["A"],"analysis":"q₁ 和 −q₁ 代表同一朝向。反号选择四元数球面上的短弧。","hasAnswer":true,"points":1}]},"actions":[]},{"type":"slide","title":"顶点混合：从骨骼到皮肤","order":15,"content":{"type":"slide","canvas":{"id":"rtr4-16","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-16-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.4 · Linear Blend Skinning\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-16-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">顶点混合：从骨骼到皮肤\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-16-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">每个顶点绑定多个骨骼，按权重混合骨骼变换后的顶点位置。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">Bᵢ 是绑定姿态骨骼变换；Bᵢ⁻¹ 先把顶点带回骨骼绑定空间。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">Gᵢ 是当前骨骼变换；常规蒙皮权重非负，且总和为 1。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">线性矩阵混合可能造成关节塌陷、糖纸扭曲；双四元数可缓解扭曲但也有局限。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-16-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">p′ = Σᵢ wᵢ Gᵢ Bᵢ⁻¹ p\nΣᵢ wᵢ=1\n\n绑定姿态：Gᵢ=Bᵢ\n则 p′=p\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-16-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">检查一：绑定姿态顶点应保持不动。检查二：只有一个权重为 1 时，结果应等于该骨骼的变换。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-16-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.4 · Linear Blend Skinning　｜　16\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"这里假设G和B都表达在同一个模型空间中；如果使用世界空间骨骼矩阵，还要相应补上模型空间转换。逆绑定矩阵不是可有可无。线性混合的矩阵未必保持正交，所以即使每根骨骼只做刚体运动，混合后的皮肤仍可能收缩。"}},"actions":[{"id":"rtr4-16-speech","type":"speech","text":"这里假设G和B都表达在同一个模型空间中；如果使用世界空间骨骼矩阵，还要相应补上模型空间转换。逆绑定矩阵不是可有可无。线性混合的矩阵未必保持正交，所以即使每根骨骼只做刚体运动，混合后的皮肤仍可能收缩。"}]},{"type":"slide","title":"变形目标与几何缓存：另外两条动画路径","order":16,"content":{"type":"slide","canvas":{"id":"rtr4-17","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-17-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.5–4.6\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-17-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">变形目标与几何缓存：另外两条动画路径\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-17-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">顶点变形：在有对应关系的两组顶点之间插值，p(s)=(1−s)p₀+sp₁。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">Blend Shape：在中性网格 N 上叠加各目标的差分 Δᵢ=Pᵢ−N。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">差分权重不必像常规蒙皮那样总和为 1，也可允许负权重。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">几何缓存存储逐帧几何，适合复杂离线动画；需要权衡存储、带宽和压缩。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-17-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">M = N + Σᵢ wᵢ Δᵢ\n\nN=(0,0), P=(0,2)\nw=0.5 → M=(0,1)\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-17-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">骨骼：关节驱动整体运动。形状混合：表情和修正形变。缓存：复杂动画的预计算回放。三者可组合使用。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-17-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.5–4.6　｜　17\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"变形首先需要顶点对应。不同拓扑的两个任意模型，不能只按数组下标线性混合。差分形式以中性网格为基底，每个权重控制一种变化，因此它与对骨骼矩阵作凸组合的权重语义不同。几何缓存减少实时求解工作，却把成本转移到存储和传输。"}},"actions":[{"id":"rtr4-17-speech","type":"speech","text":"变形首先需要顶点对应。不同拓扑的两个任意模型，不能只按数组下标线性混合。差分形式以中性网格为基底，每个权重控制一种变化，因此它与对骨骼矩阵作凸组合的权重语义不同。几何缓存减少实时求解工作，却把成本转移到存储和传输。"}]},{"type":"slide","title":"五个空间，别把矩阵放错位置","order":17,"content":{"type":"slide","canvas":{"id":"rtr4-18","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-18-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.7 · 投影前的坐标管线\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-18-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">五个空间，别把矩阵放错位置\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-18-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">模型空间 → 世界空间：M；世界空间 → 视图空间：V。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">视图空间 → 裁剪空间：P，得到四维齐次坐标。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">在裁剪空间按齐次裁剪条件处理图元，再做透视除法得到 NDC。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">最后做视口映射。NDC、像素坐标、深度缓冲值不是同一件事。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-18-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">模型 ─M→ 世界 ─V→ 视图\n视图 ─P→ 裁剪\n裁剪 ─÷w→ NDC\nNDC ─viewport→ 像素\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-18-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">排错办法：把某个已知顶点的每一阶段坐标打印出来，检查数值、符号以及 w 是否合理。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-18-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.7 · 投影前的坐标管线　｜　18\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"投影矩阵输出的不是直接可显示的二维像素。它首先产生裁剪空间中的四维坐标。必须区分投影乘法和透视除法，这也是理解近大远小与非线性深度的关键。跨图形API时，还要明确NDC深度区间、坐标手性与屏幕Y方向。"}},"actions":[{"id":"rtr4-18-speech","type":"speech","text":"投影矩阵输出的不是直接可显示的二维像素。它首先产生裁剪空间中的四维坐标。必须区分投影乘法和透视除法，这也是理解近大远小与非线性深度的关键。跨图形API时，还要明确NDC深度区间、坐标手性与屏幕Y方向。"}]},{"type":"slide","title":"正交与透视：差别在除以距离","order":18,"content":{"type":"slide","canvas":{"id":"rtr4-19","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-19-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.7.1–4.7.2\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-19-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">正交与透视：差别在除以距离\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-19-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">正交投影：相同尺寸物体的屏幕尺寸不随距离变化，适合测量和工程视图。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">透视投影：投影到 z=−d，利用相似三角形得到 x′=−dx/z。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">相机前方 z\u003c0；取距离 r=−z>0，则 x′=dx/r、y′=dy/r。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">标准透视矩阵让 w 与视图深度相关；除以 w 后出现近大远小。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-19-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">x′ = −d·x/z\ny′ = −d·y/z\n\np=(2,1,−4), d=2\n投影为 (1,0.5)\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-19-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">同一物体从距离 4 移到距离 8，其他参数不变，透视屏幕尺寸减半；正交屏幕尺寸不变。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-19-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.7.1–4.7.2　｜　19\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"请注意这是投影到指定平面的几何公式，和完整NDC矩阵之间还差视锥的缩放与深度映射。并不是所有平行线在透视后都相交：平行于成像平面的某些直线仍保持平行。我们使用“通常不再保持平行”，避免绝对化。"}},"actions":[{"id":"rtr4-19-speech","type":"speech","text":"请注意这是投影到指定平面的几何公式，和完整NDC矩阵之间还差视锥的缩放与深度映射。并不是所有平行线在透视后都相交：平行于成像平面的某些直线仍保持平行。我们使用“通常不再保持平行”，避免绝对化。"}]},{"type":"interactive","title":"实验三：透视、正交与深度精度","order":19,"content":{"type":"interactive","widgetType":"simulation","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>实验三：透视、正交与深度精度\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#eaf2fb;font:16px/1.6 'Microsoft YaHei',sans-serif;padding:24px}h1{font-size:27px;margin:0 0 5px;color:#58e0c0}p{margin:8px 0}.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;margin-top:20px}.panel{background:#192b40;border:1px solid #30475d;border-radius:16px;padding:20px}label{display:block;margin:12px 0 5px}input[type=range]{width:100%;accent-color:#58e0c0}button,select{font:inherit;border:1px solid #52768a;background:#213b52;color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}button:hover{background:#326079}canvas{background:#0b1624;border:1px solid #30475d;border-radius:14px;width:100%;height:auto}output,.value{color:#58e0c0;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#102033;padding:12px;border-radius:8px;font-size:15px}.tip{color:#ffc979}details{margin-top:14px}summary{cursor:pointer;color:#ffc979}.legend{display:flex;gap:20px;flex-wrap:wrap}.legend span{font-weight:bold}@media(max-width:760px){.layout{grid-template-columns:1fr}body{padding:12px}}\u003c/style>\u003cbody>\n\u003ch1>实验三 · 同一个物体，放远后会怎样？\u003c/h1>\u003cp>相机朝 −Z，距离 r=−z&gt;0。横向比较采用相同的参考尺度。\u003c/p>\u003cdiv class=\"layout\">\u003csection class=\"panel\">\u003clabel for=\"r\">距离 r：\u003coutput id=\"rv\">\u003c/output>\u003c/label>\u003cinput id=\"r\" type=\"range\" min=\"1\" max=\"15\" step=\"0.1\" value=\"4\">\u003clabel for=\"d\">投影平面距离 d：\u003coutput id=\"dv\">\u003c/output>\u003c/label>\u003cinput id=\"d\" type=\"range\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"2\">\u003clabel for=\"near\">近裁剪距离 n：\u003coutput id=\"nv\">\u003c/output>\u003c/label>\u003cinput id=\"near\" type=\"range\" min=\"0.1\" max=\"1\" step=\"0.1\" value=\"0.1\">\u003cpre id=\"result\">\u003c/pre>\u003cp>深度示例取 f=100、NDC 深度区间 [0,1]。\u003c/p>\u003c/section>\u003csection>\u003ccanvas id=\"c\" width=\"800\" height=\"500\">\u003c/canvas>\u003cp class=\"tip\">任务：将 r 从 4 改到 8，比较两边宽度；再提高 n，观察深度值变化。\u003c/p>\u003cdetails>\u003csummary>查看解释\u003c/summary>\u003cp>左侧正交视图只受固定标尺影响；右侧透视尺寸与 d/r 成正比。传统深度 z=f/(f−n)−fn/((f−n)r) 对 r 非线性。提高 n 往往有助于远处精度，但会裁掉更近的几何。\u003c/p>\u003c/details>\u003c/section>\u003c/div>\u003cscript>const $=id=>document.getElementById(id),g=$('c').getContext('2d');function draw(){let r=+$('r').value,d=+$('d').value,n=+$('near').value,f=100,z=f/(f-n)-f*n/((f-n)*r),w=120*d/r;g.clearRect(0,0,800,500);g.fillStyle='#eaf2fb';g.font='23px sans-serif';g.fillText('正交投影',140,48);g.fillText('透视投影',545,48);g.strokeStyle='#30475d';g.beginPath();g.moveTo(400,70);g.lineTo(400,430);g.stroke();g.fillStyle='#70afff';g.fillRect(140,170,120,120);g.fillStyle='#58e0c0';g.fillRect(600-w/2,230-w/2,w,w);g.font='18px sans-serif';g.fillStyle='#eaf2fb';g.fillText('宽度 120 px（固定标尺）',94,380);g.fillText('宽度 '+w.toFixed(1)+' px',512,380);g.fillStyle='#263b51';g.fillRect(60,450,680,12);g.fillStyle='#ffc979';g.beginPath();g.arc(60+680*z,456,8,0,Math.PI*2);g.fill();g.fillStyle='#eaf2fb';g.font='14px sans-serif';g.fillText('近端深度 0',60,488);g.fillText('远端深度 1',660,488);$('rv').textContent=r.toFixed(1);$('dv').textContent=d.toFixed(1);$('nv').textContent=n.toFixed(1);$('result').textContent='透视比例 d/r = '+(d/r).toFixed(3)+'\\n传统深度 z = '+z.toFixed(6)+'\\n反向深度 1−z = '+(1-z).toFixed(6)}document.querySelectorAll('input').forEach(e=>e.oninput=draw);draw();\u003c/script>\u003c/body>\u003c/html>"},"actions":[{"id":"lab-note-19","type":"speech","text":"默认距离四、投影平面距离二，透视物体宽六十像素。把距离加倍，宽度变三十。深度标记却早已挤到一附近，这说明屏幕尺寸的距离规律和深度缓冲编码都与除法有关，但不是同一条函数。这里展示的是数学映射，不模拟具体位数的深度量化。"}]},{"type":"slide","title":"深度精度：近裁剪面为什么这么重要？","order":20,"content":{"type":"slide","canvas":{"id":"rtr4-21","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-21-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">§4.7.2 · Z-buffer\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-21-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">深度精度：近裁剪面为什么这么重要？\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-21-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">传统透视深度通常具有 a+b/r 形式，距离 r 上的分布不均匀。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">近处变化快，远处变化慢；过小的近裁剪距离会加剧远处精度问题。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">浮点 Reversed-Z 将近处映射到 1、远处映射到 0，可改善精度分布。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">需要同步设置投影、深度比较、清除值与深度重建，不能只改一个开关。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-21-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">传统 [0,1] 深度\nz(r)= f/(f−n)\n     −fn/((f−n)r)\nz(n)=0, z(f)=1\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-21-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">Reversed-Z 常配浮点深度与 GREATER 比较、清除值 0。固定点缓冲仅反向编号，通常不获得同样收益。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#E3ECFA","fill":"#18283B","lineHeight":1.45},{"id":"rtr4-21-footer","type":"text","left":50,"top":650,"width":1140,"height":32,"rotate":0,"content":"\u003cdiv style=\"font-size:15px;line-height:1.45;\">RTR4 · 第四章 Transform　｜　§4.7.2 · Z-buffer　｜　21\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#90A2B8","lineHeight":1.45}],"background":{"type":"solid","color":"#101C2C"},"script":"原笔记投影推导中的个别符号容易混淆，所以本课统一用正的距离r。对公式的最好检查是代入近远两个端点。Reversed-Z利用浮点数在接近零处更密集的分布，与透视映射相配合；还可以与无穷远投影组合，但并非本课必须推导的内容。"}},"actions":[{"id":"rtr4-21-speech","type":"speech","text":"原笔记投影推导中的个别符号容易混淆，所以本课统一用正的距离r。对公式的最好检查是代入近远两个端点。Reversed-Z利用浮点数在接近零处更密集的分布，与透视映射相配合；还可以与无穷远投影组合，但并非本课必须推导的内容。"}]},{"type":"slide","title":"综合推演：让一个点完成整条旅程","order":21,"content":{"type":"slide","canvas":{"id":"rtr4-22","viewportSize":1280,"viewportRatio":0.5625,"theme":{"backgroundColor":"#101C2C","themeColors":["#58E0C0","#70AFFF","#FFC979"],"fontColor":"#F3F6FC","fontName":"Microsoft YaHei"},"elements":[{"id":"rtr4-22-label","type":"text","left":50,"top":26,"width":1100,"height":30,"rotate":0,"content":"\u003cdiv style=\"font-size:16px;line-height:1.45;\">应用 · 手算与排错\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","lineHeight":1.45},{"id":"rtr4-22-title","type":"text","left":50,"top":76,"width":1100,"height":80,"rotate":0,"content":"\u003cdiv style=\"font-size:39px;line-height:1.45;\">综合推演：让一个点完成整条旅程\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-22-body","type":"text","left":56,"top":176,"width":690,"height":337,"rotate":0,"content":"\u003cdiv style=\"font-size:25px;line-height:1.45;\">\u003cp style=\"margin:0 0 20px 0;\">模型点 p=(1,0,0)，先均匀缩放 2，再绕 Z 旋转 90°，再平移 (3,0,0)。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">世界点为 (3,2,0)；相机位于 (0,0,5)，朝 −Z，得到视图点 (3,2,−5)。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">投影到 z=−1 的平面：得到 (0.6,0.4)，距离越远投影越靠近中心。\u003c/p>\u003cp style=\"margin:0 0 20px 0;\">若法线原为 (0,0,1)，按线性部分的逆转置再归一化，仍朝 +Z。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#F3F6FC","lineHeight":1.45},{"id":"rtr4-22-formula","type":"text","left":786,"top":178,"width":420,"height":168,"rotate":0,"content":"\u003cdiv style=\"font-size:24px;line-height:1.45;\">\u003cp style=\"margin:18px;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei;\">(1,0,0) → (2,0,0)\n→ (0,2,0) → (3,2,0)\n→ (3,2,−5)\n→ (0.6,0.4)\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultColor":"#58E0C0","fill":"#192F43","lineHeight":1.45},{"id":"rtr4-22-example","type":"text","left":786,"top":376,"width":420,"height":220,"rotate":0,"content":"\u003cdiv style=\"font-size:22px;line-height:1.45;\">\u003cp style=\"margin:18px;\">课后任务：把 X 缩放改成 3，并将相机移至 z=10。分别预测点的位置、法线方向与屏幕尺寸。\u003c/p>\u003c/div>","defaultFontName":"Microsoft YaHei","defaultC
