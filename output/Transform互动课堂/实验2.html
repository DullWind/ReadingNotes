<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验二：法线不能只做普通变换</title><style>*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#eaf2fb;font:16px/1.6 'Microsoft YaHei',sans-serif;padding:24px}h1{font-size:27px;margin:0 0 5px;color:#58e0c0}p{margin:8px 0}.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;margin-top:20px}.panel{background:#192b40;border:1px solid #30475d;border-radius:16px;padding:20px}label{display:block;margin:12px 0 5px}input[type=range]{width:100%;accent-color:#58e0c0}button,select{font:inherit;border:1px solid #52768a;background:#213b52;color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}button:hover{background:#326079}canvas{background:#0b1624;border:1px solid #30475d;border-radius:14px;width:100%;height:auto}output,.value{color:#58e0c0;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#102033;padding:12px;border-radius:8px;font-size:15px}.tip{color:#ffc979}details{margin-top:14px}summary{cursor:pointer;color:#ffc979}.legend{display:flex;gap:20px;flex-wrap:wrap}.legend span{font-weight:bold}@media(max-width:760px){.layout{grid-template-columns:1fr}body{padding:12px}}</style><body>
<h1>实验二 · 法线正交性检查</h1><p>原切线 t=(1,1)，原法线 n=(−1,1)。改变非均匀缩放，观察两种法线。</p><div class="layout"><section class="panel"><label for="sx">X 缩放：<output id="xv"></output></label><input id="sx" type="range" min="0.25" max="3" step="0.05" value="2"><label for="sy">Y 缩放：<output id="yv"></output></label><input id="sy" type="range" min="0.25" max="3" step="0.05" value="1"><button id="uniform">设为均匀缩放</button><pre id="result"></pre><p>点积使用单位化后的向量。正确法线与切线的点积应接近 0。</p></section><section><canvas id="c" width="800" height="500"></canvas><div class="legend"><span style="color:#70afff">蓝：切线 At</span><span style="color:#ff817c">红：错误法线 An</span><span style="color:#58e0c0">青：正确法线 A⁻ᵀn</span></div><details><summary>为什么“归一化”救不了错误方向？</summary><p>归一化只把长度改成 1，不改变朝向。非均匀缩放使原来的直角被压扁；逆转置才恢复垂直约束。</p></details></section></div><script>const $=id=>document.getElementById(id),g=$('c').getContext('2d');const norm=v=>{let l=Math.hypot(...v);return v.map(x=>x/l)},dot=(a,b)=>a[0]*b[0]+a[1]*b[1];function arrow(v,color,label){const x=400+v[0]*170,y=250-v[1]*170,a=Math.atan2(y-250,x-400);g.strokeStyle=color;g.fillStyle=color;g.lineWidth=4;g.beginPath();g.moveTo(400,250);g.lineTo(x,y);g.stroke();g.beginPath();g.moveTo(x,y);g.lineTo(x-15*Math.cos(a-.4),y-15*Math.sin(a-.4));g.lineTo(x-15*Math.cos(a+.4),y-15*Math.sin(a+.4));g.fill();g.font='18px sans-serif';g.fillText(label,x+12,y+8)}function draw(){let x=+$('sx').value,y=+$('sy').value,t=norm([x,y]),bad=norm([-x,y]),good=norm([-1/x,1/y]);g.clearRect(0,0,800,500);g.strokeStyle='#253c50';g.lineWidth=1;for(let k=50;k<800;k+=50){g.beginPath();g.moveTo(k,0);g.lineTo(k,500);g.stroke()}for(let k=0;k<500;k+=50){g.beginPath();g.moveTo(0,k);g.lineTo(800,k);g.stroke()}arrow(t,'#70afff','切线');arrow(bad,'#ff817c','An');arrow(good,'#58e0c0','A⁻ᵀn');$('xv').textContent=x.toFixed(2);$('yv').textContent=y.toFixed(2);$('result').textContent='错误法线 · 切线 = '+dot(t,bad).toFixed(4)+'\n正确法线 · 切线 = '+dot(t,good).toFixed(4)}document.querySelectorAll('input').forEach(e=>e.oninput=draw);$('uniform').onclick=()=>{$('sx').value=1.5;$('sy').value=1.5;draw()};draw();</script></body></html>
