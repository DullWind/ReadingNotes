<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验一：交换变换顺序，会发生什么？</title><style>*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#eaf2fb;font:16px/1.6 'Microsoft YaHei',sans-serif;padding:24px}h1{font-size:27px;margin:0 0 5px;color:#58e0c0}p{margin:8px 0}.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;margin-top:20px}.panel{background:#192b40;border:1px solid #30475d;border-radius:16px;padding:20px}label{display:block;margin:12px 0 5px}input[type=range]{width:100%;accent-color:#58e0c0}button,select{font:inherit;border:1px solid #52768a;background:#213b52;color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}button:hover{background:#326079}canvas{background:#0b1624;border:1px solid #30475d;border-radius:14px;width:100%;height:auto}output,.value{color:#58e0c0;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#102033;padding:12px;border-radius:8px;font-size:15px}.tip{color:#ffc979}details{margin-top:14px}summary{cursor:pointer;color:#ffc979}.legend{display:flex;gap:20px;flex-wrap:wrap}.legend span{font-weight:bold}@media(max-width:760px){.layout{grid-template-columns:1fr}body{padding:12px}}</style><body>
<h1>实验一 · 变换顺序实验室</h1><p>坐标系为 X 向右、Y 向上；列向量左乘。虚线是原图，青色是结果。</p><div class="layout"><section class="panel">
<label for="order">矩阵顺序（右侧先执行）</label><select id="order"><option>TRS</option><option>RTS</option><option>TSR</option><option>STR</option></select>
<label for="angle">绕原点旋转 θ：<output id="av"></output>°</label><input id="angle" type="range" min="-180" max="180" value="90">
<label for="sx">X 缩放：<output id="sv"></output></label><input id="sx" type="range" min="0.25" max="3" step="0.05" value="2">
<label for="tx">X 平移：<output id="tv"></output></label><input id="tx" type="range" min="-3" max="3" step="0.1" value="3">
<button id="reset">重置数值</button><pre id="result"></pre></section><section><canvas id="c" width="800" height="540"></canvas><p class="tip">任务：保持默认数值，先预测红点 (1,0) 的结果，再将 TRS 改为 RTS。</p><details><summary>查看解析</summary><p>TRS：先 S→(2,0)，再 R→(0,2)，最后 T→(3,2)。RTS：先 S→(2,0)，再 T→(5,0)，最后 R→(0,5)。旋转会连同先前的位移一起旋转。</p></details></section></div><script>const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');const P=p=>[400+p[0]*42,270-p[1]*42];function draw(){const a=+$('angle').value*Math.PI/180,s=+$('sx').value,t=+$('tx').value,o=$('order').value;const f=p=>{let [x,y]=p;for(const k of [...o].reverse()){if(k==='S')x*=s;if(k==='T')x+=t;if(k==='R')[x,y]=[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)]}return[x,y]};g.clearRect(0,0,800,540);g.lineWidth=1;for(let i=-9;i<=9;i++){g.strokeStyle=i===0?'#7590aa':'#203247';g.beginPath();g.moveTo(...P([i,-6]));g.lineTo(...P([i,6]));g.stroke()}for(let i=-6;i<=6;i++){g.strokeStyle=i===0?'#7590aa':'#203247';g.beginPath();g.moveTo(...P([-9,i]));g.lineTo(...P([9,i]));g.stroke()}const poly=[[0,0],[1,0],[1,1],[0,1]];function shape(ps,color,dash){g.strokeStyle=color;g.lineWidth=3;g.setLineDash(dash);g.beginPath();ps.forEach((p,i)=>i?g.lineTo(...P(p)):g.moveTo(...P(p)));g.closePath();g.stroke();g.setLineDash([])}shape(poly,'#71869e',[6,6]);shape(poly.map(f),'#58e0c0',[]);const r=f([1,0]);g.fillStyle='#ff817c';g.beginPath();g.arc(...P(r),6,0,Math.PI*2);g.fill();g.fillStyle='#f4f7fb';g.font='18px sans-serif';g.fillText('X',775,255);g.fillText('Y',413,22);$('av').textContent=$('angle').value;$('sv').textContent=s.toFixed(2);$('tv').textContent=t.toFixed(1);$('result').textContent=o+' · (1,0) = ('+r.map(v=>v.toFixed(2)).join(', ')+')'}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',draw));$('reset').onclick=()=>{$('order').value='TRS';$('angle').value=90;$('sx').value=2;$('tx').value=3;draw()};draw();</script></body></html>
