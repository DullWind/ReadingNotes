<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验三：透视、正交与深度精度</title><style>*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#eaf2fb;font:16px/1.6 'Microsoft YaHei',sans-serif;padding:24px}h1{font-size:27px;margin:0 0 5px;color:#58e0c0}p{margin:8px 0}.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;margin-top:20px}.panel{background:#192b40;border:1px solid #30475d;border-radius:16px;padding:20px}label{display:block;margin:12px 0 5px}input[type=range]{width:100%;accent-color:#58e0c0}button,select{font:inherit;border:1px solid #52768a;background:#213b52;color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}button:hover{background:#326079}canvas{background:#0b1624;border:1px solid #30475d;border-radius:14px;width:100%;height:auto}output,.value{color:#58e0c0;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#102033;padding:12px;border-radius:8px;font-size:15px}.tip{color:#ffc979}details{margin-top:14px}summary{cursor:pointer;color:#ffc979}.legend{display:flex;gap:20px;flex-wrap:wrap}.legend span{font-weight:bold}@media(max-width:760px){.layout{grid-template-columns:1fr}body{padding:12px}}</style><body>
<h1>实验三 · 同一个物体，放远后会怎样？</h1><p>相机朝 −Z，距离 r=−z&gt;0。横向比较采用相同的参考尺度。</p><div class="layout"><section class="panel"><label for="r">距离 r：<output id="rv"></output></label><input id="r" type="range" min="1" max="15" step="0.1" value="4"><label for="d">投影平面距离 d：<output id="dv"></output></label><input id="d" type="range" min="0.5" max="3" step="0.1" value="2"><label for="near">近裁剪距离 n：<output id="nv"></output></label><input id="near" type="range" min="0.1" max="1" step="0.1" value="0.1"><pre id="result"></pre><p>深度示例取 f=100、NDC 深度区间 [0,1]。</p></section><section><canvas id="c" width="800" height="500"></canvas><p class="tip">任务：将 r 从 4 改到 8，比较两边宽度；再提高 n，观察深度值变化。</p><details><summary>查看解释</summary><p>左侧正交视图只受固定标尺影响；右侧透视尺寸与 d/r 成正比。传统深度 z=f/(f−n)−fn/((f−n)r) 对 r 非线性。提高 n 往往有助于远处精度，但会裁掉更近的几何。</p></details></section></div><script>const $=id=>document.getElementById(id),g=$('c').getContext('2d');function draw(){let r=+$('r').value,d=+$('d').value,n=+$('near').value,f=100,z=f/(f-n)-f*n/((f-n)*r),w=120*d/r;g.clearRect(0,0,800,500);g.fillStyle='#eaf2fb';g.font='23px sans-serif';g.fillText('正交投影',140,48);g.fillText('透视投影',545,48);g.strokeStyle='#30475d';g.beginPath();g.moveTo(400,70);g.lineTo(400,430);g.stroke();g.fillStyle='#70afff';g.fillRect(140,170,120,120);g.fillStyle='#58e0c0';g.fillRect(600-w/2,230-w/2,w,w);g.font='18px sans-serif';g.fillStyle='#eaf2fb';g.fillText('宽度 120 px（固定标尺）',94,380);g.fillText('宽度 '+w.toFixed(1)+' px',512,380);g.fillStyle='#263b51';g.fillRect(60,450,680,12);g.fillStyle='#ffc979';g.beginPath();g.arc(60+680*z,456,8,0,Math.PI*2);g.fill();g.fillStyle='#eaf2fb';g.font='14px sans-serif';g.fillText('近端深度 0',60,488);g.fillText('远端深度 1',660,488);$('rv').textContent=r.toFixed(1);$('dv').textContent=d.toFixed(1);$('nv').textContent=n.toFixed(1);$('result').textContent='透视比例 d/r = '+(d/r).toFixed(3)+'\n传统深度 z = '+z.toFixed(6)+'\n反向深度 1−z = '+(1-z).toFixed(6)}document.querySelectorAll('input').forEach(e=>e.oninput=draw);draw();</script></body></html>
